<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إكمال الحساب | RideNow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--blue:#1a6fe0;--blue-d:#1257b8;--navy:#0f2a5c;--ink:#16213a;--mut:#6b7690;--line:#d9e0ec;--field:#f3f6fb;--ok:#1a8f4c;--err:#d63838}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Cairo",system-ui,sans-serif;color:var(--ink);background:#fff;direction:rtl}
.hidden{display:none!important}

/* الهيدر */
.hd{position:sticky;top:0;z-index:40;background:var(--navy);border-radius:0 0 26px 26px;padding:calc(14px + env(safe-area-inset-top)) 18px 18px}
.hd-in{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto}
.hb{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.hb svg{width:20px;height:20px}
.hd-t{flex:1;min-width:0}
.hd-t b{display:block;font-size:18px;font-weight:800;color:#fff;line-height:1.4}
.hd-t small{color:#b9c6e4;font-size:13px}
.hd-in img{width:68px;height:68px;object-fit:contain;flex:none}
.steps{display:flex;justify-content:space-between;position:relative;max-width:640px;margin:16px auto 0}
.steps::before{content:"";position:absolute;top:13px;right:10%;left:10%;height:2px;background:#2d4a85}
.st{flex:1;text-align:center;position:relative;font-size:11.5px;color:#b9c6e4}
.st i{position:relative;z-index:1;display:flex;width:27px;height:27px;border-radius:50%;margin:0 auto 4px;background:#2d4a85;color:#fff;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px}
.st.on{color:#fff;font-weight:700} .st.on i{background:var(--blue);box-shadow:0 0 0 4px var(--navy),0 0 0 6px var(--blue)}
.st.done{color:#fff} .st.done i{background:var(--ok)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--field);border:1.5px solid var(--line);border-radius:14px;margin-bottom:16px}
.seg label{cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg .c{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:10px;font-weight:700;font-size:15px;color:var(--mut);background:transparent;transition:background .15s,color .15s}
.seg .c svg{width:22px;height:22px}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg.s3 .c{flex-direction:column;height:98px;gap:8px;font-size:14px}
.seg.s3 .c svg{width:54px;height:36px}
.seg input:checked+.c{background:var(--blue);color:#fff}
.seg input:focus-visible+.c{outline:2px solid var(--blue)}

/* المحتوى */
.body{width:100%;max-width:640px;margin:0 auto;padding:22px 18px 120px}
.intro{display:flex;gap:14px;align-items:center;margin-bottom:20px}
.intro .ib2{width:52px;height:52px;border-radius:16px;background:#e8f0ff;color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.intro .ib2 svg{width:26px;height:26px}
.intro h2{flex:1;font-size:20px;font-weight:800;color:var(--navy);line-height:1.4}
.help{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font:inherit;font-size:18px;font-weight:800;line-height:1;cursor:pointer;flex:none}
.hm{position:fixed;inset:0;z-index:150;background:rgba(8,20,50,.55);display:none;align-items:center;justify-content:center;padding:20px}
.hm.show{display:flex}
.hbox{background:#fff;border-radius:20px;width:100%;max-width:420px;padding:22px 20px 18px}
.hbox h3{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:12px}
.hbox ul{list-style:none;margin-bottom:16px}
.hbox li{position:relative;padding:0 18px 0 0;margin-bottom:10px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.hbox li::before{content:"";position:absolute;right:0;top:11px;width:8px;height:8px;border-radius:50%;background:var(--blue)}

.prov{display:flex;align-items:center;gap:10px;background:#f3f7ff;border:1.5px solid #d4e3ff;border-radius:16px;padding:12px 14px;margin-bottom:18px}
.prov .av{width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;overflow:hidden;flex:none}
.prov .av img{width:100%;height:100%;object-fit:cover}
.prov .pi{flex:1;min-width:0;line-height:1.45}
.prov .pi b{display:block;font-size:15.5px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prov .pi small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.link{background:none;border:0;font:inherit;color:var(--err);font-weight:700;font-size:13px;cursor:pointer;flex:none}

label.lb{display:block;font-weight:700;font-size:14px;margin:6px 0 6px}
.field{position:relative;margin-bottom:12px}
.field input,.field select{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:15px;color:var(--ink);padding:0 44px;text-align:right;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus{border-color:var(--blue)}
.field input::placeholder{color:#8a94ab}
.field input[readonly]{background:var(--field);color:var(--mut);cursor:not-allowed}
.field.bad input{border-color:var(--err);background:#fff6f6}
.field .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mut);display:flex;pointer-events:none}
.field .eye{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer}
.field .eye svg,.field .ic svg{width:20px;height:20px}
.hint{font-size:12.5px;color:var(--mut);margin:-4px 0 12px;min-height:18px}
.hint.bad{color:var(--err)} .hint.good{color:var(--ok)}
.radios{display:flex;gap:18px;margin-bottom:12px}
.radios label{display:flex;align-items:center;gap:7px;font-weight:600;cursor:pointer}
.radios input{accent-color:var(--blue);width:18px;height:18px}

.msg{display:none;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:14px;background:#fdeaea;color:var(--err);font-weight:600}
.msg.show{display:block}

.idbox{border:1.5px dashed #b9c8e6;border-radius:14px;background:#fff;padding:12px;margin-bottom:14px}
.idbox .t{font-size:13.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.idbox .t svg{width:18px;height:18px;color:var(--blue)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pic{height:110px;border-radius:10px;background:var(--field);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font:inherit;font-weight:600;cursor:pointer;overflow:hidden;position:relative}
.pic b{font-weight:600;font-size:12.5px}
.pic svg{width:26px;height:26px;color:var(--blue)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic.done{border-color:var(--ok)}
.pic .ck{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center}
.pic .ck svg{width:14px;height:14px;color:#fff}
.poses{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pz{text-align:center;font-size:11.5px;font-weight:600;color:var(--mut)}
.pz .pi{aspect-ratio:1;border-radius:10px;background:var(--field);border:1.5px solid var(--line);overflow:hidden;margin-bottom:3px}
.pz .pi img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.pz.ok .pi{border-color:var(--ok)} .pz.ok{color:var(--ok)}

.btn{width:100%;height:50px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--blue-d)} .btn:disabled{opacity:.6;cursor:wait}
.nav{position:fixed;right:0;left:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:12px max(18px,calc((100vw - 640px)/2)) calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:space-between}
.nav .btn{flex:none;width:auto;min-width:130px;padding:0 30px}
.nav .bk2{height:50px;min-width:130px;border-radius:14px;background:#fff;border:1.5px solid var(--line);color:var(--mut);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.nav .sp2{display:block;min-width:130px;visibility:hidden}
.done-box{text-align:center;padding:30px 0}
.done-box .ok{width:78px;height:78px;border-radius:50%;background:#e6f6ec;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.done-box .ok svg{width:42px;height:42px}
.done-box h2{margin-bottom:6px;color:var(--navy)}
.done-box p{color:var(--mut);font-size:14.5px;line-height:1.8;margin-bottom:14px}

/* الكاميرا */
.modal{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
.modal.show{display:flex}
.stage{position:relative;flex:1;overflow:hidden}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#face-video{transform:scaleX(-1)}
.m-top{position:absolute;top:0;left:0;right:0;z-index:3;padding:calc(14px + env(safe-area-inset-top)) 16px 20px;color:#fff;text-align:center;font-weight:800;font-size:18px;background:linear-gradient(#000b,#0000)}
.m-note{position:absolute;left:0;right:0;bottom:16px;z-index:3;padding:0 20px;color:#fff;text-align:center;font-size:14px;font-weight:600;text-shadow:0 1px 4px #000}
.m-note.big{font-size:20px;font-weight:800;bottom:54px}
.m-bot{padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;background:#000}
.m-cancel{min-width:70px;color:#fff;background:none;border:0;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:var(--blue);cursor:pointer}
#id-frame{position:absolute;left:50%;top:50%;width:min(90%,620px);aspect-ratio:1.586;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);z-index:2}
#face-oval{position:absolute;left:50%;top:44%;width:min(68%,300px);aspect-ratio:3/4;transform:translate(-50%,-50%);border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 100vmax rgba(0,0,0,.6);z-index:2;transition:border-color .15s}
#face-oval.ok{border-color:#2fd16f}
.dots{position:absolute;left:0;right:0;bottom:20px;z-index:3;display:flex;justify-content:center;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:#ffffff55}
.dots i.cur{background:#fff} .dots i.ok{background:#2fd16f}
.arrow{position:absolute;z-index:3;width:44px;height:44px;color:#fff;display:none}
.arrow svg{width:44px;height:44px;stroke-width:2.4}
.arrow.a-right,.arrow.a-left,.arrow.a-up,.arrow.a-down{display:block}
.arrow.a-right{right:6%;top:44%;transform:translateY(-50%)}
.arrow.a-left{left:6%;top:44%;transform:translateY(-50%) rotate(180deg)}
.arrow.a-up{left:50%;top:6%;transform:translateX(-50%) rotate(-90deg)}
.arrow.a-down{left:50%;top:72%;transform:translateX(-50%) rotate(90deg)}
.busy{position:fixed;inset:0;z-index:200;background:rgba(8,20,50,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-weight:700}
.busy.show{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #ffffff44;border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#id-frame{transition:border-color .15s}
#id-frame.ok{border-color:#2fd16f}
.bdbtn{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:15px;color:#8a94ab;padding:0 44px;text-align:right;cursor:pointer}
.bdbtn.has{color:var(--ink);font-weight:600}
.dp{position:fixed;inset:0;z-index:160;background:rgba(8,20,50,.5);display:none;align-items:flex-end}
.dp.show{display:flex}
.dsheet{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
.dsh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dsh-h b{font-size:17px;font-weight:800;color:var(--navy)}
.dsh-h button{background:none;border:0;font:inherit;font-size:16px;font-weight:700;cursor:pointer;color:var(--mut)}
.dsh-h button.ok{color:var(--blue)}
.dwheels{position:relative;display:grid;grid-template-columns:1fr 1.5fr 1.1fr;height:180px;gap:4px}
.dwheels::before{content:"";position:absolute;left:0;right:0;top:72px;height:36px;background:var(--field);border-radius:10px}
.wl{position:relative;height:180px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:72px 0;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wl::-webkit-scrollbar{display:none}
.wl div{height:36px;line-height:36px;text-align:center;scroll-snap-align:center;font-size:19px;font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<header class="hd">
  <div class="hd-in">
    <img src="logo.png" alt="RideNow">
    <div class="hd-t"><b id="s-title">إكمال بيانات حسابك</b></div>
    <button type="button" class="hb" id="s-back" aria-label="رجوع"></button>
  </div>
  <div class="steps" id="steps"></div>
</header>

<main class="body">
  <div id="s-msg" class="msg"></div>
  <div class="intro" id="intro"></div>
  <div id="v-signup">

    <!-- 1 البيانات الأساسية -->
    <div class="step" data-s="1">
      <div class="prov hidden" id="prov">
        <div class="av" id="prov-av"></div>
        <div class="pi"><b id="prov-name"></b><small id="prov-sub"></small></div>
        <button type="button" class="link" id="prov-out">خروج</button>
      </div>
      <label class="lb">الاسم الكامل</label>
      <div class="field" id="name-f"><span class="ic" data-i="user"></span><input id="s-name" autocomplete="name" placeholder="الاسم كما في البطاقة"></div>
      <div class="hint hidden" id="name-hint"></div>
      <label class="lb">البريد الإلكتروني <span style="color:var(--err)">*</span></label>
      <div class="field"><span class="ic" data-i="mail"></span><input id="s-email" type="email" readonly tabindex="-1" autocomplete="email" placeholder="name@example.com" style="direction:ltr;text-align:right"></div>
      <label class="lb">رقم الهاتف</label>
      <div class="field"><span class="ic" data-i="phone"></span><input id="s-phone" inputmode="numeric" placeholder="01012345678"></div>
      <label class="lb">النوع</label>
      <div class="seg">
        <label><input type="radio" name="gender" value="male" checked><span class="c"><span data-i="male" style="display:flex"></span>ذكر</span></label>
        <label><input type="radio" name="gender" value="female"><span class="c"><span data-i="female" style="display:flex"></span>أنثى</span></label>
      </div>
      <label class="lb">نوع الحساب</label>
      <div class="seg">
        <label><input type="radio" name="role" value="client" checked><span class="c"><span data-i="user" style="display:flex"></span>عميل</span></label>
        <label><input type="radio" name="role" value="driver"><span class="c"><span data-i="car" style="display:flex"></span>سائق</span></label>
      </div>
      <div id="veh" class="hidden">
        <label class="lb">نوع المركبة</label>
        <div class="seg s3">
          <label><input type="radio" name="vehicle" value="car" checked><span class="c"><span data-i="vcar" style="display:flex"></span>سيارة</span></label>
          <label><input type="radio" name="vehicle" value="tuktuk"><span class="c"><span data-i="vtuk" style="display:flex"></span>تيك توك</span></label>
          <label><input type="radio" name="vehicle" value="motorcycle"><span class="c"><span data-i="vmoto" style="display:flex"></span>موتوسيكل</span></label>
        </div>
      </div>
      <div class="nav"><span class="sp2"></span><button class="btn" data-next>التالي</button></div>
    </div>

    <!-- 2 الهوية -->
    <div class="step hidden" data-s="2">
      <label class="lb">ادخل رقمك القومي</label>
      <div class="field"><span class="ic" data-i="id"></span><input id="s-nid" inputmode="numeric" placeholder="14 رقم"></div>
      <div class="hint" id="nid-hint"></div>
      <div class="idbox">
        <div class="t"><span data-i="card" style="display:flex"></span>صورة الهوية</div>
        <div class="pics">
          <button type="button" class="pic" id="pic-front"><span data-i="cam" style="display:flex"></span><b>الوجه الأمامي</b></button>
          <button type="button" class="pic" id="pic-back"><span data-i="cam" style="display:flex"></span><b>الوجه الخلفي</b></button>
        </div>
      </div>
      <label class="lb">كلمة المرور</label>
      <div class="field"><span class="ic" data-i="lock"></span><input id="s-pass" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل (حروف وأرقام)"><button type="button" class="eye" data-eye="s-pass" aria-label="إظهار كلمة المرور"></button></div>
      <div class="field"><span class="ic" data-i="lock"></span><input id="s-pass2" type="password" autocomplete="new-password" placeholder="تأكيد كلمة المرور"></div>
      <div class="nav"><button type="button" class="bk2" data-prev>العودة</button><button class="btn" data-next>التالي</button></div>
    </div>

    <!-- 3 العنوان -->
    <div class="step hidden" data-s="3">
      <label class="lb">تاريخ الميلاد</label>
      <div class="field"><span class="ic" data-i="cal"></span><button type="button" class="bdbtn" id="s-bd">اختر تاريخ الميلاد</button></div>
      <label class="lb">المحافظة</label>
      <div class="field"><span class="ic" data-i="pin"></span><select id="s-gov"></select></div>
      <label class="lb">المدينة / المنطقة</label>
      <div class="field"><span class="ic" data-i="pin"></span><input id="s-city" placeholder="المدينة أو المنطقة"></div>
      <label class="lb">العنوان بالتفصيل</label>
      <div class="field"><span class="ic" data-i="home"></span><input id="s-addr" autocomplete="street-address" placeholder="الشارع، رقم المبنى"></div>
      <div class="nav"><button type="button" class="bk2" data-prev>العودة</button><button class="btn" data-next>التالي</button></div>
    </div>

    <!-- 4 التحقق -->
    <div class="step hidden" data-s="4">
      <div class="idbox">
        <div class="t"><span data-i="user" style="display:flex"></span>التحقق من الوجه</div>
        <div class="poses" id="poses"></div>
        <button type="button" class="btn" id="face-start" style="height:42px;font-size:15px;margin-top:10px">ابدأ التحقق من الوجه</button>
      </div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0 12px;cursor:pointer">
        <input type="checkbox" id="s-agree" style="accent-color:var(--blue);width:18px;height:18px;margin-top:3px">
        <span>أؤكد أن البيانات والصور صحيحة وأوافق على شروط الاستخدام وسياسة الخصوصية</span>
      </label>
      <div class="nav"><button type="button" class="bk2" data-prev>العودة</button><button class="btn" id="s-submit">إنشاء الحساب</button></div>
    </div>

    <!-- 5 اكتمل -->
    <div class="step hidden" data-s="5">
      <div class="done-box">
        <div class="ok" data-i="check"></div>
        <h2>تم حفظ بياناتك</h2>
        <p>حسابك قيد مراجعة الهوية.</p>
        <button class="btn" id="to-login">فتح صفحتي الآن</button>
      </div>
    </div>
  </div>
</main>

<div class="modal" id="id-modal">
  <div class="stage" id="id-stage"><video id="id-video" playsinline muted></video><div id="id-frame"></div>
    <div class="m-top" id="id-title">صوّر البطاقة</div>
    <div class="m-note" id="id-note">ضع البطاقة داخل الإطار</div></div>
  <div class="m-bot"><button type="button" class="m-cancel" id="id-cancel">إلغاء</button><button type="button" class="shutter" id="id-snap" aria-label="التقاط"></button><span class="m-cancel" style="visibility:hidden">إلغاء</span></div>
</div>
<div class="modal" id="face-modal">
  <div class="stage"><video id="face-video" playsinline muted></video><div id="face-oval"></div><div id="face-arrow" class="arrow"></div>

function checkNID(n,gender){
  if(!/^\d{14}$/.test(n)) return 'الرقم القومي لازم يكون 14 رقم';
  if(n[0]!=='2'&&n[0]!=='3') return 'الرقم القومي غير صحيح';
  const y=(n[0]==='2'?1900:2000)+ +n.slice(1,3), m=+n.slice(3,5), d=+n.slice(5,7), dt=new Date(y,m-1,d), now=new Date();
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return 'تاريخ الميلاد داخل الرقم غير صحيح';
  if(dt>now) return 'تاريخ الميلاد داخل الرقم في المستقبل';
  const age=now.getFullYear()-y-(now<new Date(now.getFullYear(),m-1,d)?1:0);
  if(age<18) return 'لازم يكون عمرك 18 سنة أو أكتر';
  if(!GOVS[n.slice(7,9)]) return 'كود المحافظة داخل الرقم غير صحيح';
  if(/^(\d)\1{13}$/.test(n)) return 'الرقم القومي غير صحيح';
  if(gender && ((gender==='male')!==((+n[12])%2===1))) return 'الرقم القومي لا يطابق النوع المختار';
  return '';
}

function nameIssue(n){
  n=(n||'').trim().replace(/\s+/g,' ');
  if(!n) return 'اكتب اسمك الكامل';
  if(!/^[\u0621-\u064AA-Za-z ]+$/.test(n)) return 'الاسم لازم يكون حروف بس (من غير أرقام أو رموز أو إيموجي)';
  const w=n.split(' ');
  if(w.length<3) return 'اكتب الاسم ثلاثي على الأقل زي ما في البطاقة';
  if(w.some(x=>x.length<2)) return 'كل جزء من الاسم لازم يكون حرفين على الأقل';
  if(/(.)\1{2,}/.test(n)) return 'الاسم فيه حروف متكررة كتير، اكتب اسمك الحقيقي';
  if(w.some(x=>/^[A-Za-z]+$/.test(x)&&x.length>3&&!/[aeiouy]/i.test(x))) return 'الاسم شكله عشوائي، اكتب اسمك الحقيقي';
  return '';
}

function validate(n){
  if(n===1){
    const ni=nameIssue($('#s-name').value); if(ni) return ni;
    if(!oauthUser||!EMAIL_RE.test(oauthUser.email||'')) return 'حسابك مفيهوش بريد إلكتروني، فعّل صلاحية الإيميل في حساب جوجل أو فيسبوك وسجّل تاني';
    if(!checkPhone($('#s-phone').value)) return 'رقم الهاتف غير صحيح (مثال: 01012345678)';
  }
  if(n===2){
    const e=checkNID($('#s-nid').value,val('gender')); if(e) return e;
    if(!files.front||!files.back) return 'ارفع صورة الوجه الأمامي والخلفي للبطاقة';
    if(!checkPass($('#s-pass').value)) return 'كلمة المرور لازم تكون 8 أحرف على الأقل وتحتوي على حروف وأرقام';
    if($('#s-pass').value!==$('#s-pass2').value) return 'كلمتا المرور غير متطابقتين';
  }
  if(n===3){
    if(!birthISO) return 'اختار تاريخ الميلاد';
    if(birthISO!==nidBirth($('#s-nid').value)) return 'تاريخ الميلاد لا يطابق الرقم القومي';
    if(!$('#s-gov').value) return 'اختر المحافظة';

    if($('#s-addr').value.trim().length<6) return 'اكتب العنوان بالتفصيل';
  }
  return '';
}

$('#s-submit').onclick=async()=>{

  try{
    const {error}=await sb.auth.updateUser({password:pass}); if(error) throw new Error('تعذر حفظ كلمة المرور');
    if(!oauthUser.email) throw new Error('حسابك مفيهوش إيميل، فعّل صلاحية الإيميل في الحساب وسجّل تاني');
    const user=oauthUser, email=oauthUser.email;
    const front=await upload(user.id,'front',files.front), back=await upload(user.id,'back',files.back);
    const sp={}; for(const k of ['center','right','left','up','down']) sp[k]=await upload(user.id,'face-'+k,shots[k]);
    const {error:pe}=await sb.from('profiles').upsert({
      id:user.id,email,contact_email:oauthUser.email,provider:((oauthUser.app_metadata||{}).provider||'oauth'),full_name:$('#s-name').value.trim(),phone:$('#s-phone').value,national_id:nid,

      address:$('#s-addr').value.trim(),id_front:front,id_back:back,selfie:sp.center,selfie_center:sp.center,selfie_right:sp.right,selfie_left:sp.left,selfie_up:sp.up,selfie_down:sp.down,

async function getCam(video,facing){
  stopCam(video);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('الكاميرا مش متاحة. افتح الموقع على https من متصفح حديث');
  try{ video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false}); }
  catch(e){ throw new Error('لازم تسمح للموقع باستخدام الكاميرا'); }
  video.muted=true; video.setAttribute('playsinline',''); await video.play();
}
function stopCam(v){ const s=v.srcObject; if(s) s.getTracks().forEach(t=>t.stop()); v.srcObject=null; }
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('تعذر تحميل أداة قراءة البطاقة، اتأكد من الإنترنت')); document.head.appendChild(s); }); }

function idRect(k){
  const v=idVideo, st=$('#id-stage').getBoundingClientRect(), fr=$('#id-frame').getBoundingClientRect();
  const sc=Math.max(st.width/v.videoWidth,st.height/v.videoHeight);
  const ox=(v.videoWidth*sc-st.width)/2, oy=(v.videoHeight*sc-st.height)/2;
  let sx=(fr.left-st.left+ox)/sc, sy=(fr.top-st.top+oy)/sc, sw=fr.width/sc, sh=fr.height/sc;
  if(k&&k!==1){ sx-=sw*(k-1)/2; sy-=sh*(k-1)/2; sw*=k; sh*=k; }
  return {sx,sy,sw,sh};
}
async function snapID(){
  const v=idVideo; if(!v.videoWidth||!idRun) return; idRun=false;
  const {sx,sy,sw,sh}=idRect(1);
  const c=document.createElement('canvas'); c.width=Math.min(1400,Math.round(sw)); c.height=Math.round(c.width*sh/sw);
  c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  const key=idKey; closeID(); await verifyID(c,key);
}
$('#id-snap').onclick=snapID;

/* ===== كشف البطاقة تلقائي: الإطار يبقى أخضر ويتصور لوحده ===== */
const ID_EDGE=1.5, ID_SHARP=20, ID_HOLD=5;   // لو بيتصور بسهولة/صعوبة زيادة عدّل الأرقام دي
let idRun=false, idOk=0, idLast=0;
const dc=document.createElement('canvas'); dc.width=240; dc.height=151;
const dx=dc.getContext('2d',{willReadFrequently:true});
function idLooksGood(){
  const v=idVideo; if(!v.videoWidth) return false;
  const W=240,H=151, r=idRect(1.2);
  dx.drawImage(v,r.sx,r.sy,r.sw,r.sh,0,0,W,H);
  const d=dx.getImageData(0,0,W,H).data, g=new Float32Array(W*H);
  for(let i=0;i<W*H;i++) g[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;
  const gx=new Float32Array(W*H), gy=new Float32Array(W*H); let gm=0,n=0;
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ const i=y*W+x; gx[i]=Math.abs(g[i+1]-g[i-1]); gy[i]=Math.abs(g[i+W]-g[i-W]); gm+=gx[i]+gy[i]; n++; }
  gm/=n;
  let s1=0,s2=0,c=0;
  for(let y=Math.floor(H*.25);y<H*.75;y++) for(let x=Math.floor(W*.25);x<W*.75;x++){ const i=y*W+x, l=4*g[i]-g[i-1]-g[i+1]-g[i-W]-g[i+W]; s1+=l; s2+=l*l; c++; }
  if(s2/c-(s1/c)*(s1/c)<ID_SHARP) return false;           // صورة مهزوزة
  const mx=Math.round(W*.0833), my=Math.round(H*.0833), B=8, x0=Math.floor(W*.2), x1=Math.floor(W*.8), y0=Math.floor(H*.2), y1=Math.floor(H*.8);
  const rowPeak=yc=>{ let b=0; for(let y=yc-B;y<=yc+B;y++){ let a=0; for(let x=x0;x<x1;x++) a+=gy[y*W+x]; a/=(x1-x0); if(a>b) b=a; } return b; };
  const colPeak=xc=>{ let b=0; for(let x=xc-B;x<=xc+B;x++){ let a=0; for(let y=y0;y<y1;y++) a+=gx[y*W+x]; a/=(y1-y0); if(a>b) b=a; } return b; };
  const sides=[rowPeak(my),rowPeak(H-1-my),colPeak(mx),colPeak(W-1-mx)].filter(v=>v/(gm+2)>=ID_EDGE).length;
  return sides>=3;   // 3 من 4 حواف للبطاقة على الإطار
}
function idLoop(t){
  if(!idRun) return;
  if(t-idLast>110){
    idLast=t; const ok=idLooksGood();
    $('#id-frame').classList.toggle('ok',ok); idOk=ok?idOk+1:0;
    $('#id-note').textContent=ok?'ثبّت البطاقة...':'ضع البطاقة داخل الإطار';
    if(idOk>=ID_HOLD){ snapID(); return; }
  }
  requestAnimationFrame(idLoop);
}
let ocrW=null;
async function ocr(c,psm){
  if(!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  if(!ocrW) ocrW=await Tesseract.createWorker('ara');
  await ocrW.setParameters({tessedit_pageseg_mode:psm||'3'});
  const {data}=await ocrW.recognize(c); return data.text||'';
}
/* تجهيز الصورة للقراءة: قص شريط، تكبير، رمادي، رفع التباين */
function prep(c,y0,h){
  const w=c.width, sy=Math.round(c.height*y0), sh=Math.round(c.height*h);
  const o=document.createElement('canvas'); o.width=Math.min(1800,w*2); o.height=Math.round(o.width*sh/w);
  const x=o.getContext('2d'); x.drawImage(c,0,sy,w,sh,0,0,o.width,o.height);
  const im=x.getImageData(0,0,o.width,o.height), d=im.data; let lo=255,hi=0;
  for(let i=0;i<d.length;i+=4){ const g=d[i]*.3+d[i+1]*.59+d[i+2]*.11; d[i]=g; if(g<lo) lo=g; if(g>hi) hi=g; }
  const k=255/Math.max(1,hi-lo);
  for(let i=0;i<d.length;i+=4){ const g=Math.max(0,Math.min(255,(d[i]-lo)*k)); d[i]=d[i+1]=d[i+2]=g; }
  x.putImageData(im,0,0); return o;
}
const latin=t=>t.replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-1632).replace(/[\u06F0-\u06F9]/g,d=>d.charCodeAt(0)-1776);
function lev(a,b){
  const m=a.length,n=b.length; let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const q=[i]; for(let j=1;j<=n;j++) q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=q; }
  return p[n];
}
const normAr=t=>t.replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,'');
function wordHits(text,words){
  const t=normAr(text);
  return words.filter(w=>{ const n=normAr(w); if(t.includes(n)) return true; if(n.length<5) return false;
    for(let i=0;i+n.length<=t.length;i++) if(lev(n,t.substr(i,n.length))<=1) return true; return false; }).length;
}
function bestMatch(text,nid){
  const d=latin(text).replace(/\D/g,''); let best=0;
  for(let i=0;i<d.length;i++) for(const L of [13,14,15]){ if(i+L<=d.length) best=Math.max(best,14-lev(nid,d.slice(i,i+L))); }
  return best;
}
function tile(key,blob){
  const t=$('#pic-'+key); $$('img,.ck',t).forEach(x=>x.remove()); t.classList.remove('done');
  if(!blob) return;
  const im=new Image(); im.src=URL.createObjectURL(blob); t.appendChild(im);
  const k=document.createElement('span'); k.className='ck'; k.innerHTML=ICONS.check; t.appendChild(k); t.classList.add('done');
}
async function verifyID(c,key){
  busy(true,'جاري فحص البطاقة... ممكن ياخد ثواني');
  try{
    if(key==='front'){
      const nid=$('#s-nid').value; let sc=0, hits=0, seen='';
      for(const [y0,h,psm] of [[.5,.5,'6'],[.7,.22,'7'],[0,1,'3']]){
        const t=await ocr(prep(c,y0,h),psm); sc=Math.max(sc,bestMatch(t,nid)); hits=Math.max(hits,wordHits(t,FRONT_WORDS)); seen+=(seen?' | ':'')+latin(t).replace(/\D/g,'').slice(0,30); if(sc>=MIN_ID_MATCH) break;
      }
      if(ID_STRICT&&sc<REVIEW_ID_MATCH&&hits<1) throw new Error("الرقم القومي في الصورة مش واضح أو مش مطابق للرقم اللي كتبته. صوّر الوجه الأمامي للبطاقة الأصلية كاملة، في إضاءة كويسة وبدون انعكاس.");
      verifiedNid=nid; idCheck.front={match:sc,words:hits,read:seen,verified:sc>=MIN_ID_MATCH};
    }else{
      const text=await ocr(c,false), t=text.replace(/\s+/g,' '), hits=BACK_WORDS.filter(w=>t.includes(w)).length;
      if(hits<1) throw new Error('الصورة دي مش شبه الوجه الخلفي لبطاقة الرقم القومي. صوّر الخلفي كامل وواضح.');
      idCheck.back={hits};
    }
    files[key]=await toBlob(c); tile(key,files[key]);
  }catch(err){ files[key]=null; tile(key,null); msg($('#s-msg'),err.message||'تعذر فحص الصورة'); }
  busy(false);
}
$('#s-nid').addEventListener('input',()=>{ if(verifiedNid&&$('#s-nid').value!==verifiedNid){ verifiedNid=null; files.front=null; tile('front',null); } });

/* ---------- بصمة الوجه (5 اتجاهات) ---------- */
const faceVideo=$('#face-video'); let landmarker=null, running=false, order=[], idx=0, hold=0, pBase=null, capturing=false;
let shots={};
async function loadFace(){
  if(landmarker) return landmarker;
  const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const vis=await import(V+'/vision_bundle.mjs');
  const fs=await vis.FilesetResolver.forVisionTasks(V+'/wasm');
  const mk=d=>vis.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:d},runningMode:'VIDEO',numFaces:2});
  try{ landmarker=await mk('GPU'); }catch(e){ landmarker=await mk('CPU'); }
  return landmarker;
}
const shuffle=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function renderPoses(){
  $('#poses').innerHTML=['center','right','left','up','down'].map(p=>`<div class="pz ${shots[p]?'ok':''}"><div class="pi" data-p="${p}"></div><small>${POSE_LBL[p]}</small></div>`).join('');
  Object.keys(shots).forEach(p=>{ const d=$(`.pi[data-p=${p}]`); const im=new Image(); im.src=URL.createObjectURL(shots[p]); d.appendChild(im); });
  $('#face-start').textContent=Object.keys(shots).length===5?'إعادة التحقق من الوجه':'ابدأ التحقق من الوجه';
}
function faceUI(){
  const p=order[idx]; $('#face-txt').textContent=POSE_TXT[p]||'';
  $('#face-dots').innerHTML=order.map((_,i)=>`<i class="${i<idx?'ok':i===idx?'cur':''}"></i>`).join('');
  const a=$('#face-arrow'); a.className='arrow a-'+p; a.innerHTML=p==='center'?'':ICONS.arrow;
}
async function startFace(){
  msg($('#s-msg')); $('#face-modal').classList.add('show'); $('#face-txt').textContent='جاري تجهيز الكاميرا...';
  try{ await getCam(faceVideo,'user'); await loadFace(); }
  catch(err){ closeFace(); return msg($('#s-msg'),err.message&&!/import|fetch|module/i.test(err.message)?err.message:'تعذر تحميل نظام التعرف على الوجه، اتأكد من الإنترنت وجرب تاني'); }
  shots={}; order=['center',...shuffle(['right','left','up','down'])]; idx=0; hold=0; pBase=null; running=true; capturing=false; faceUI(); loop();
}
function closeFace(){ running=false; stopCam(faceVideo); $('#face-modal').classList.remove('show'); renderPoses(); }
$('#face-start').onclick=startFace; $('#face-cancel').onclick=closeFace;
function loop(){
  if(!running) return;
  if(faceVideo.readyState>=2&&!capturing){
    const r=landmarker.detectForVideo(faceVideo,performance.now()); step_(r.faceLandmarks||[]);
  }
  requestAnimationFrame(loop);
}
async function step_(faces){
  const txt=$('#face-txt'), oval=$('#face-oval'), pose=order[idx];
  const say=t=>{ txt.textContent=t; oval.classList.remove('ok'); hold=0; };
  if(!faces.length) return say('مش شايف وشك، خليه جوه الدايرة');
  if(faces.length>1) return say('لازم يكون في وش واحد بس قدام الكاميرا');
  const m=faces[0], L=m[234], R=m[454], N=m[1], eyeY=(m[33].y+m[263].y)/2, ch=m[152];
  const fw=R.x-L.x, cx=(L.x+R.x)/2;
  if(fw<0.22) return say('قرّب من الكاميرا شوية');
  if(fw>0.8) return say('بعّد عن الكاميرا شوية');
  if(Math.abs(cx-0.5)>0.2) return say('خلي وشك في نص الدايرة');
  const yaw=(N.x-cx)/fw, pitch=(N.y-eyeY)/(ch.y-eyeY);
  let okp=false;
  if(pose==='center') okp=Math.abs(yaw)<0.07;
  else if(pose==='right') okp=yaw<-YAW_T;
  else if(pose==='left') okp=yaw>YAW_T;
  else if(pose==='up') okp=Math.abs(yaw)<0.12&&pitch<pBase-PITCH_T;
  else if(pose==='down') okp=Math.abs(yaw)<0.12&&pitch>pBase+PITCH_T;
  if(!okp){ txt.textContent=POSE_TXT[pose]; oval.classList.remove('ok'); hold=0; return; }
  oval.classList.add('ok'); txt.textContent='ثبّت...';
  if(++hold<HOLD) return;
  capturing=true;
  if(pose==='center') pBase=pitch;
  const c=document.createElement('canvas'); c.width=640; c.height=Math.round(640*faceVideo.videoHeight/faceVideo.videoWidth);
  c.getContext('2d').drawImage(faceVideo,0,0,c.width,c.height);
  shots[pose]=await toBlob(c,.8);
  idx++; hold=0; oval.classList.remove('ok');
  if(idx>=order.length){ closeFace(); return; }
  faceUI(); setTimeout(()=>{ capturing=false; },600);
}
renderPoses();

async function upload(uid,name,blob){
  if(!blob) return null;
  const path=`${uid}/${name}-${Date.now()}.jpg`;
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{upsert:true,contentType:'image/jpeg'});
  if(error) throw new Error('فشل رفع الصورة');
  return path;
}

/* ===== تاريخ الميلاد: عجلات زي الايفون ===== */
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const nidBirth=n=>`${(n[0]==='2'?1900:2000)+ +n.slice(1,3)}-${n.slice(3,5)}-${n.slice(5,7)}`;
let birthISO='', bd={d:1,m:1,y:2000};
const wD=$('#w-d'), wM=$('#w-m'), wY=$('#w-y'), IH=36, pad=n=>String(n).padStart(2,'0');
const thisY=new Date().getFullYear(), yearsArr=[]; for(let y=thisY-18;y>=thisY-80;y--) yearsArr.push(y);
const fillW=(el,arr)=>{ el.innerHTML=arr.map(t=>`<div>${t}</div>`).join(''); };
const dim=(y,m)=>new Date(y,m,0).getDate();
function fillDays(){ const n=dim(bd.y,bd.m); fillW(wD,Array.from({length:n},(_,i)=>i+1)); if(bd.d>n) bd.d=n; }
fillW(wM,MONTHS); fillW(wY,yearsArr); fillDays();
const idxOf=el=>Math.round(el.scrollTop/IH);
function setWheels(){ fillDays(); wD.scrollTop=(bd.d-1)*IH; wM.scrollTop=(bd.m-1)*IH; wY.scrollTop=Math.max(0,yearsArr.indexOf(bd.y))*IH; }
let wTmr;
function onWheel(){
  clearTimeout(wTmr);
  wTmr=setTimeout(()=>{
    const m=Math.min(12,Math.max(1,idxOf(wM)+1)), y=yearsArr[Math.min(yearsArr.length-1,Math.max(0,idxOf(wY)))], prevD=Math.max(1,idxOf(wD)+1);
    const changed=(m!==bd.m||y!==bd.y); bd.m=m; bd.y=y; bd.d=Math.min(prevD,dim(y,m));
    if(changed){ fillDays(); wD.scrollTop=(bd.d-1)*IH; }
  },90);
}
[wD,wM,wY].forEach(w=>w.addEventListener('scroll',onWheel,{passive:true}));
$('#s-bd').onclick=()=>{
  const n=$('#s-nid').value;
  if(!birthISO&&/^\d{14}$/.test(n)&&!checkNID(n)){ const [y,m,d]=nidBirth(n).split('-').map(Number); if(yearsArr.includes(y)) bd={d,m,y}; }
  else if(birthISO){ const [y,m,d]=birthISO.split('-').map(Number); bd={d,m,y}; }
  $('#dp').classList.add('show'); setWheels();
};
$('#dp-x').onclick=()=>$('#dp').classList.remove('show');
$('#dp').onclick=e=>{ if(e.target.id==='dp') $('#dp').classList.remove('show'); };
$('#dp-ok').onclick=()=>{
  setTimeout(()=>{
    birthISO=`${bd.y}-${pad(bd.m)}-${pad(bd.d)}`;
    $('#s-bd').textContent=`${bd.d} ${MONTHS[bd.m-1]} ${bd.y}`; $('#s-bd').classList.add('has');
    $('#dp').classList.remove('show');
  },120);
};

goStep(1);
