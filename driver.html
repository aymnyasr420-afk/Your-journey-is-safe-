<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0f2a5c">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RideNow | السائق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--blue:#1a6fe0;--blue-d:#1257b8;--navy:#0f2a5c;--ink:#16213a;--mut:#6b7690;--line:#d9e0ec;--field:#f3f6fb;--ok:#1a8f4c;--err:#d63838;--warn:#b7791f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Cairo",system-ui,sans-serif;color:var(--ink);background:#e8edf5;direction:rtl}
#map{position:fixed;inset:0;z-index:0}
.leaflet-top{top:62px!important}
.leaflet-control-attribution{font-size:9px!important}

/* الشريط العلوي */
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.chip{background:#fff;border:0;border-radius:99px;box-shadow:0 2px 12px rgba(15,42,92,.22);display:flex;align-items:center;gap:8px;font:inherit;color:var(--ink);cursor:pointer}
.menu{padding:4px;position:relative}
.av{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.sw2{flex:1;max-width:230px;justify-content:space-between;padding:6px 14px 6px 8px;font-weight:700;font-size:14px;cursor:default}
.tg{position:relative;width:50px;height:28px;flex:none}
.tg input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2;margin:0}
.tg i{position:absolute;inset:0;border-radius:99px;background:#c9d2e3;transition:background .2s}
.tg i::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg input:checked+i{background:var(--ok)}
.tg input:checked+i::after{transform:translateX(-22px)}
.tg input:disabled{cursor:not-allowed} .tg input:disabled+i{opacity:.5}
.loc{width:48px;height:48px;justify-content:center;color:var(--blue);margin-right:auto}
.loc svg{width:24px;height:24px}
.pop{position:absolute;top:54px;right:0;background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(15,42,92,.3);padding:12px;min-width:190px;display:none;flex-direction:column;gap:8px}
.pop.show{display:flex}
.pop b{color:var(--navy);font-size:15px} .pop small{color:var(--mut)}
.pop button{border:0;background:#fdeaea;color:var(--err);font:inherit;font-weight:700;padding:9px;border-radius:10px;cursor:pointer}

/* علامات A و B */
.pin{position:relative;width:34px;height:34px;border-radius:50%;border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pin::after{content:"";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--c);border-bottom:0}
.pin.a{background:#1a6fe0;--c:#1a6fe0} .pin.b{background:#1a8f4c;--c:#1a8f4c}
.me{width:20px;height:20px;border-radius:50%;background:#0f2a5c;border:3px solid #fff;box-shadow:0 0 0 0 rgba(15,42,92,.5);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(15,42,92,0)}100%{box-shadow:0 0 0 0 rgba(15,42,92,0)}}

/* الشريط السفلي: ثلث الشاشة */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;height:38vh;min-height:310px;max-height:420px;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(15,42,92,.28);padding:8px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow-y:auto;max-width:640px;margin:0 auto}
.grab{width:42px;height:4px;border-radius:9px;background:#d9e0ec;margin:0 auto 10px;flex:none}
.rq-h{display:flex;align-items:center;gap:12px}
.rq-h .av{width:54px;height:54px;font-size:21px}
.rq-n{flex:1;min-width:0}
.rq-n b{display:block;font-size:17px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq-n small{color:var(--mut);font-size:12.5px}
.nv{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:700}
.nv button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:800;color:var(--navy);cursor:pointer}
.pills{display:flex;gap:8px;margin:10px 0 8px;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:6px;background:#eef4ff;color:var(--blue);border-radius:99px;padding:5px 12px 5px 10px;font-weight:700;font-size:13px}
.pl svg{width:18px;height:18px} .pl img{width:26px;height:20px;object-fit:contain}
.pl.v{background:#fff6e0;color:#8a5a00}
.route{border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.pt{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:4px 0}
.pt+.pt{border-top:1px dashed var(--line)}
.pt i{width:22px;height:22px;border-radius:50%;color:#fff;font-style:normal;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.pt.a i{background:var(--blue)} .pt.b i{background:var(--ok)}
.pt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;gap:14px;font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:8px}
.meta b{color:var(--ink)}
.acts{display:flex;gap:10px;margin-top:auto}
.btn{flex:1;height:48px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ok{background:var(--ok)} .btn.gh{background:#fff;color:var(--mut);border:1.5px solid var(--line);flex:.6}
.btn.call{background:var(--ok);flex:0 0 auto;padding:0 18px} .btn svg{width:22px;height:22px}
.st{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ok);margin-bottom:6px}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse2 1.4s infinite}
@keyframes pulse2{50%{opacity:.3}}
.big{text-align:center;padding:10px 0 6px}
.big h3{font-size:20px;color:var(--navy);margin:8px 0 4px}
.big p{color:var(--mut);font-size:14px;line-height:1.7;margin-bottom:14px}
.radar{width:64px;height:64px;border-radius:50%;margin:6px auto 0;background:#e8f0ff;position:relative}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--blue);animation:rad 2s infinite}
.radar::after{animation-delay:1s}
@keyframes rad{from{transform:scale(.6);opacity:.9}to{transform:scale(1.6);opacity:0}}
.banner{padding:12px 14px;border-radius:14px;font-weight:700;font-size:14px;margin-bottom:10px}
.banner.pending{background:#fff6e0;color:var(--warn)} .banner.rejected,.banner.error{background:#fdeaea;color:var(--err)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:60;display:none;max-width:90%}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="chip menu" id="menu"><div class="av" id="av"></div>
    <div class="pop" id="pop"><b id="nm">...</b><small id="vn"></small><button id="out">تسجيل الخروج</button></div></div>
  <label class="chip sw2"><span id="swt">غير متاح</span><span class="tg"><input type="checkbox" id="on" disabled><i></i></span></label>
  <button class="chip loc" id="loc" aria-label="موقعي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="big"><div class="radar"></div><h3>جاري التحميل...</h3></div></div>

<script src="loader.js"></script>
<script>
const SUPABASE_URL = "https://odjlhzojqsrbqffehukm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yRm2rQvgy0NK_CIqoqtYdw_LBve2iAU";
const LOGIN_PAGE = "index.html";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s,r=document)=>r.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const TRIPS={
  solo:['سفر لوحدك',IC('<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/>')],
  family:['معاك أسرتك',IC('<circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20c.7-3.5 3-5.5 5.5-5.5s4.8 2 5.5 5.5M15 14.5c2.5 0 4.5 1.5 5.5 5"/>')],
  friends:['مع أصحابك',IC('<circle cx="12" cy="7" r="3"/><circle cx="5" cy="10" r="2.2"/><circle cx="19" cy="10" r="2.2"/><path d="M6 20c.5-3.5 2.8-5.5 6-5.5s5.5 2 6 5.5"/>')],
  order:['ترسل أوردر',IC('<path d="M3 7.5l9-4.5 9 4.5v9l-9 4.5-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/>')]
};
const VNAME={car:'سيارة',tuktuk:'تيك توك',motorcycle:'موتوسيكل'};
const VIMG={car:'taxi.png',tuktuk:'tuktuk.png',motorcycle:'motorcycle.png'};
const PHONE=IC('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>');

let P=null, uid=null, online=false, rides=[], idx=0, ignored=new Set(), seen=new Set(), myPos=null, meMarker=null, firstFix=false;
let map, layer=null, drawn='', routeCache={}, busy=false;

/* ---------- الخريطة ---------- */
function initMap(){
  map=L.map('map',{zoomControl:false,attributionControl:false}).setView([30.05,31.24],11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  L.control.attribution({position:'topright',prefix:false}).addTo(map);
  layer=L.layerGroup().addTo(map);
}
const pin=(c,l)=>L.divIcon({className:'',html:`<div class="pin ${c}">${l}</div>`,iconSize:[34,44],iconAnchor:[17,44]});
function startGPS(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(p=>{
    myPos=[p.coords.latitude,p.coords.longitude];
    if(!meMarker) meMarker=L.marker(myPos,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[20,20]}),interactive:false,zIndexOffset:900}).addTo(map); else meMarker.setLatLng(myPos);
    if(!firstFix){ firstFix=true; if(!rides[idx]) map.setView(myPos,14); }
  },()=>{},{enableHighAccuracy:true,maximumAge:5000});
}
$('#loc').onclick=()=>{ if(myPos) map.setView(myPos,15); else toast('شغّل الموقع (GPS) من إعدادات المتصفح'); };
const km=(a,b)=>{ const R=6371,r=x=>x*Math.PI/180,dLa=r(b[0]-a[0]),dLo=r(b[1]-a[1]); const h=Math.sin(dLa/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
async function getRoute(r){
  if(routeCache[r.id]) return routeCache[r.id];
  const A=[r.pickup_lat,r.pickup_lng], B=[r.dropoff_lat,r.dropoff_lng];
  try{
    const res=await fetch(`https://router.project-osrm.org/route/v1/driving/${A[1]},${A[0]};${B[1]},${B[0]}?overview=full&geometries=geojson`);
    const j=await res.json(); const pts=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
    return routeCache[r.id]=pts;
  }catch(e){ return routeCache[r.id]=[A,B]; }
}
function clearMap(){ if(layer) layer.clearLayers(); drawn=''; }
async function drawRide(r){
  const key=r.id+r.status; if(drawn===key) return; drawn=key;
  layer.clearLayers();
  const A=[r.pickup_lat,r.pickup_lng], B=[r.dropoff_lat,r.dropoff_lng];
  L.marker(A,{icon:pin('a','A')}).addTo(layer); L.marker(B,{icon:pin('b','B')}).addTo(layer);
  const pts=await getRoute(r); if(drawn!==key) return;
  L.polyline(pts,{color:'#fff',weight:10,opacity:.95}).addTo(layer);
  L.polyline(pts,{color:'#1a6fe0',weight:6,opacity:.95,lineCap:'round'}).addTo(layer);
  const b=L.latLngBounds(pts.concat(myPos?[myPos]:[]));
  map.fitBounds(b,{paddingTopLeft:[30,90],paddingBottomRight:[30,$('#sheet').offsetHeight+30],maxZoom:16});
}

/* ---------- الشريط السفلي ---------- */
const sheet=h=>{ $('#sheet').innerHTML='<div class="grab"></div>'+h; };
function toast(t){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',3200); }
function avatarHTML(r){ return r.client_avatar?`<img src="${esc(r.client_avatar)}" referrerpolicy="no-referrer" alt="">`:esc((r.client_name||'؟')[0]); }
function rideHTML(r,n){
  const acc=r.status==='accepted', t=TRIPS[r.trip_type]||TRIPS.solo;
  const far=myPos?km(myPos,[r.pickup_lat,r.pickup_lng]):null;
  const nav=(!acc&&n>1)?`<div class="nv"><button data-a="next" aria-label="التالي">›</button>${idx+1} / ${n}<button data-a="prev" aria-label="السابق">‹</button></div>`:'';
  return `${acc?'<div class="st">في الطريق للعميل</div>':''}
  <div class="rq-h"><div class="av">${avatarHTML(r)}</div>
    <div class="rq-n"><b>${esc(r.client_name||'عميل')}</b><small>${far!=null?`العميل بعيد عنك ${far.toFixed(1)} كم`:'عميل RideNow'}</small></div>${nav}</div>
  <div class="pills"><span class="pl">${t[1]}${t[0]}</span><span class="pl v"><img src="${VIMG[r.vehicle_type]||VIMG.car}" alt="">${VNAME[r.vehicle_type]||''}</span></div>
  <div class="route"><div class="pt a"><i>A</i><span>${esc(r.pickup_text||'موقع العميل')}</span></div><div class="pt b"><i>B</i><span>${esc(r.dropoff_text||'الوجهة')}</span></div></div>
  <div class="meta"><span>المسافة <b>${r.distance_km!=null?(+r.distance_km).toFixed(1)+' كم':'-'}</b></span><span>الوقت <b>${r.duration_min!=null?Math.round(r.duration_min)+' دقيقة':'-'}</b></span></div>
  <div class="acts">${acc
    ?`${r.client_phone?`<a class="btn call" href="tel:${esc(r.client_phone)}" aria-label="اتصال">${PHONE}اتصال</a>`:''}<button class="btn ok" data-a="finish">انتهت الرحلة</button><button class="btn gh" data-a="cancel">إلغاء</button>`
    :`<button class="btn gh" data-a="ignore">تجاهل</button><button class="btn" data-a="accept">قبول الرحلة</button>`}</div>`;
}
function render(){
  if(!P) return;
  if(P.status!=='approved'){
    const m=P.status==='rejected'?['rejected','تم رفض طلب التوثيق، تواصل مع الدعم']:['pending','حسابك قيد مراجعة الهوية. هتقدر تستقبل الطلبات بعد الموافقة'];
    sheet(`<div class="big"><div class="banner ${m[0]}">${m[1]}</div></div>`); clearMap(); return;
  }
  const r=rides[idx];
  if(r){ sheet(rideHTML(r,rides.length)); drawRide(r); return; }
  clearMap();
  if(!online) sheet(`<div class="big"><h3>أنت غير متاح</h3><p>فعّل التوفر عشان تستقبل طلبات ${VNAME[P.vehicle_type]||'الرحلات'} القريبة منك</p><div class="acts"><button class="btn" data-a="go">ابدأ استقبال الطلبات</button></div></div>`);
  else sheet(`<div class="big"><div class="radar"></div><h3>بندوّر على طلبات...</h3><p>أول ما عميل يطلب ${VNAME[P.vehicle_type]||'رحلة'} هتظهرلك هنا</p><div class="acts"><button class="btn gh" data-a="stop" style="flex:1">وقف الاستقبال</button></div></div>`);
}
$('#sheet').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]'); if(!b||busy) return; const a=b.dataset.a, r=rides[idx];
  if(a==='next'){ idx=(idx+1)%rides.length; render(); return; }
  if(a==='prev'){ idx=(idx-1+rides.length)%rides.length; render(); return; }
  if(a==='ignore'){ ignored.add(r.id); rides=rides.filter(x=>x.id!==r.id); idx=0; render(); return; }
  if(a==='go'){ $('#on').checked=true; await setOnline(true); return; }
  if(a==='stop'){ $('#on').checked=false; await setOnline(false); return; }
  busy=true; b.disabled=true;
  const fn={accept:'accept_ride',finish:'finish_ride',cancel:'cancel_ride'}[a];
  if(fn){
    if(a==='cancel'&&!confirm('تلغي الرحلة؟ هترجع للعملاء كطلب جديد.')){ busy=false; b.disabled=false; return; }
    const {error}=await sb.rpc(fn,{rid:r.id});
    if(error) toast(/taken|busy/.test(error.message)?'الرحلة اتاخدت أو عندك رحلة شغالة':'تعذر تنفيذ الطلب: '+error.message);
    else if(a==='finish') toast('تم إنهاء الرحلة. شكراً ليك');
    drawn=''; await poll();
  }
  busy=false;
});

/* ---------- جلب الطلبات (كل 5 ثواني) ---------- */
async function poll(){
  if(!P||P.status!=='approved') return;
  const {data,error}=await sb.from('rides').select('*').in('status',['requested','accepted']).order('created_at',{ascending:true});
  if(error) return;
  const mine=(data||[]).find(r=>r.status==='accepted'&&r.driver_id===uid);
  const open=mine?[]:(data||[]).filter(r=>r.status==='requested'&&!ignored.has(r.id)&&online);
  open.forEach(r=>{ if(!seen.has(r.id)){ seen.add(r.id); if(navigator.vibrate) navigator.vibrate([200,100,200]); } });
  const cur=rides[idx]&&rides[idx].id;
  rides=mine?[mine]:open;
  const k=rides.findIndex(r=>r.id===cur); idx=k>=0?k:0;
  render();
}
function paintTop(){ $('#swt').textContent=online?'متاح لاستقبال الطلبات':'غير متاح'; }
async function setOnline(v){
  const cb=$('#on'); cb.disabled=true;
  const {error}=await sb.rpc('set_driver_online',{v});
  if(error){ cb.checked=!v; toast('تعذر التحديث: '+error.message); }
  else{ online=v; P.online=v; paintTop(); await poll(); }
  cb.disabled=P.status!=='approved'||rides.some(r=>r.status==='accepted');
}
$('#on').addEventListener('change',e=>setOnline(e.target.checked));
$('#menu').addEventListener('click',e=>{ if(e.target.closest('#out')) return; $('#pop').classList.toggle('show'); });
$('#out').onclick=async()=>{ await sb.auth.signOut(); location.replace(LOGIN_PAGE); };

/* ---------- تحميل البيانات (حقيقي) ---------- */
(async()=>{
  const T=3; let dn=0; const tick=l=>{ dn++; LD.set(dn/T,l); };
  LD.show('جاري التحقق من حسابك...');
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session) return location.replace(LOGIN_PAGE);
    uid=session.user.id; tick('جاري تحميل بياناتك...');
    const {data:p,error}=await sb.from('profiles').select('full_name,role,phone,status,national_id,vehicle_type,online').eq('id',uid).maybeSingle();
    if(error) throw new Error('تعذر قراءة بياناتك: '+error.message+' (شغّل الـ SQL)');
    if(!p||!p.national_id) return location.replace('complete.html');
    if(p.role!=='driver') return location.replace('client.html');
    P=p; online=!!p.online; tick('جاري تجهيز الخريطة...');
    const md=session.user.user_metadata||{}, photo=md.avatar_url||md.picture;
    $('#av').innerHTML=photo?`<img src="${esc(photo)}" referrerpolicy="no-referrer" alt="">`:esc((p.full_name||'؟')[0]);
    $('#nm').textContent=p.full_name||''; $('#vn').textContent=VNAME[p.vehicle_type]||'';
    $('#on').checked=online; $('#on').disabled=p.status!=='approved'; paintTop();
    initMap(); startGPS(); render(); await poll();
    tick('تم'); await new Promise(r=>setTimeout(r,450));
    setInterval(poll,5000);
  }catch(e){
    sheet(`<div class="big"><div class="banner error">${esc(e.message)}</div></div>`);
  }
  LD.hide();
})();
</script>
</body>
